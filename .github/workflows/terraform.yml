name: terraform

# Pipeline dell'infrastruttura, separata da quella applicativa (deploy.yml): una modifica
# al codice non richiede di rieseguire un piano Terraform, e viceversa.
#
# RESOURCE_PREFIX (variabile del repository, opzionale): se valorizzato il progetto GCP è
# condiviso e tutte le risorse (incluso il bucket di state) portano questo prefisso.
#
# Avvio manuale; apply aspetta un'approvazione manuale su una issue GitHub prima di
# applicare esattamente il piano già revisionato.

on:
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    working-directory: devops/cloud

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Assicura che il bucket dello state esista
        run: |
          gcloud storage buckets describe "gs://${{ vars.RESOURCE_PREFIX || vars.PROJECT_ID }}-tfstate" \
            --project "${{ vars.PROJECT_ID }}" >/dev/null 2>&1 || \
          gcloud storage buckets create "gs://${{ vars.RESOURCE_PREFIX || vars.PROJECT_ID }}-tfstate" \
            --project "${{ vars.PROJECT_ID }}" \
            --location "${{ vars.REGION }}" \
            --uniform-bucket-level-access

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.RESOURCE_PREFIX || vars.PROJECT_ID }}-tfstate" \
            -backend-config="prefix=sage"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: |
          terraform plan \
            -var "project_id=${{ vars.PROJECT_ID }}" \
            -var "region=${{ vars.REGION }}" \
            -var "resource_prefix=${{ vars.RESOURCE_PREFIX }}" \
            -out=tfplan

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: devops/cloud/tfplan
          retention-days: 1

  approval:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: ${{ vars.APPROVERS }}
          minimum-approvals: 1
          issue-title: "Approvazione terraform apply — Sage (run ${{ github.run_id }})"

  apply:
    needs: approval
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.RESOURCE_PREFIX || vars.PROJECT_ID }}-tfstate" \
            -backend-config="prefix=sage"

      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: devops/cloud

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

